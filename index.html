<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mijn Recepten">
  <meta name="theme-color" content="#2e2b25">
  <title>Mijn Recepten</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap');

    :root {
      --bg: #2e2b25;
      --surface: #474238;
      --surface-2: #645c50;
      --surface-3: #82796a;
      --text: #f9f4ed;
      --muted: #c0b6a5;
      --muted-2: #a19786;
      --accent: #8fa073;
      --accent-light: #aebf92;
      --accent-dark: #728157;
      --sage: #d67f48;
      --sage-light: #f6a06b;
      --on-accent: #2e2b25;
      --heart: #8fa073;
      --font-heading: 'Caprasimo', system-ui, sans-serif;
      --font-body: 'Figtree', system-ui, sans-serif;
      --div-soft: color-mix(in srgb, var(--text) 8%, transparent);
      --div-mid: color-mix(in srgb, var(--text) 20%, transparent);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-body);
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      max-width: 560px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 12px 146px 12px;
      min-height: 100vh;
    }
    h1 {
      font-family: var(--font-heading); font-weight: 400; font-size: 36px;
      margin: 0 0 4px 0; color: var(--text);
    }
    h1.tight { margin: 0 0 18px 0; }
    h1 .sub { display: block; font-family: var(--font-body); font-weight: 400; font-size: 15px; color: var(--muted); margin-top: 2px; }
    .screen { display: none; }
    .screen.active { display: block; }

    .card {
      background: var(--surface); border-radius: 26px; padding: 18px;
      display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;
    }
    .card-title { font-family: var(--font-heading); font-weight: 400; font-size: 22px; color: var(--text); margin-bottom: 2px; }
    .card-meta { display: flex; gap: 12px; font-size: 14.5px; color: var(--muted); flex-wrap: wrap; }
    .card-source { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 13px; color: var(--muted-2); }
    .card-actions { display: flex; gap: 8px; }

    button {
      font: inherit; font-family: var(--font-heading); font-weight: 400; font-size: 16.5px;
      border: none; border-radius: 999px; cursor: pointer; padding: 16px 20px;
      background: var(--surface-2); color: var(--text);
    }
    button.primary { background: var(--accent); color: var(--on-accent); }
    button.confirm-danger { background: var(--accent-dark); color: var(--on-accent); font-weight: 700; font-family: var(--font-body); font-size: 14px; }
    button.outline {
      background: transparent; color: var(--text);
      border: 1.5px solid color-mix(in srgb, var(--text) 25%, transparent);
    }
    button.outline.subtle { color: var(--muted); border-color: color-mix(in srgb, var(--text) 18%, transparent); font-family: var(--font-body); font-size: 13px; }
    button:active { opacity: 0.7; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-block { width: 100%; height: 50px; font-size: 15px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row > button { flex: 1; }

    .icon-btn {
      width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%;
      background: var(--surface); color: var(--muted);
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .icon-btn svg { display: block; }

    .search-bar {
      display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 18px;
      border-radius: 999px; background: var(--surface); margin-bottom: 18px;
    }
    .search-bar input {
      flex: 1; min-width: 0; border: none; background: transparent; outline: none;
      color: var(--text); font-size: 16.5px; font-family: var(--font-body);
    }
    .search-bar input::placeholder { color: var(--muted-2); }

    .empty { text-align: center; padding: 56px 16px; color: var(--muted); }
    .empty .emoji { font-size: 34px; margin-bottom: 10px; }
    .empty .msg { font-size: 16.5px; line-height: 1.5; }

    .section-label {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted-2); margin: 0 0 10px 4px;
    }

    #nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg); border-top: 1px solid var(--div-soft);
      display: flex; align-items: stretch;
      padding: 10px 6px calc(env(safe-area-inset-bottom, 0px) + 14px) 6px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.25);
      z-index: 10;
    }
    #nav button {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 5px; padding: 10px 2px; min-height: 72px; border-radius: 16px;
      background: transparent; color: var(--muted-2); font-family: var(--font-body); font-weight: 700;
    }
    #nav button:active { background: var(--surface); }
    #nav button .icon svg { display: block; width: 37px; height: 37px; }
    #nav button span.label { font-size: 13px; }
    #nav button.active { color: var(--accent-light); }

    .day-row {
      display: flex; align-items: center; gap: 12px; min-height: 68px;
      padding: 10px 16px; border-radius: 20px; cursor: pointer;
      background: transparent; border: 1.5px dashed var(--div-mid); margin-bottom: 9px;
    }
    .day-row.filled { border-style: solid; }
    .day-row .day-num-wrap { width: 50px; flex-shrink: 0; }
    .day-row .weekday { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .day-row .daynum { font-family: var(--font-heading); font-weight: 400; font-size: 21px; color: var(--text); }
    .day-row .day-body { flex: 1; min-width: 0; }
    .day-row .day-title { font-size: 15.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day-row .day-empty-label { font-size: 15.5px; color: var(--muted-2); }
    .day-row .day-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
    .day-row .today-tag { font-size: 11px; font-weight: 700; color: var(--accent-light); text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0; }

    .week-nav-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .week-nav-row .week-label { flex: 1; text-align: center; font-size: 14px; color: var(--muted); }
    .today-jump { display: block; margin: 0 0 14px auto; height: 30px; padding: 0 14px; font-size: 12px; background: var(--surface); color: var(--accent-light); font-family: var(--font-heading); }

    .segmented { display: inline-flex; border-radius: 999px; background: var(--surface); padding: 4px; margin-bottom: 18px; }
    .segmented button {
      height: 36px; padding: 0 18px; background: transparent; color: var(--muted);
      font-family: var(--font-heading); font-weight: 400; font-size: 13px;
    }
    .segmented button.active { background: var(--accent); color: var(--on-accent); }
    .segmented.small button { height: 32px; padding: 0 14px; }

    .dot-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; color: var(--text); border-bottom: 1px solid var(--div-soft); }
    .dot-item:last-child { border-bottom: none; }
    .dot-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .grocery-group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .grocery-group-head .g-title { font-family: var(--font-heading); font-weight: 400; font-size: 16px; color: var(--text); }
    .grocery-group-head .g-meta { font-size: 12px; color: var(--muted-2); }
    .grocery-item-line { font-size: 13px; color: var(--muted); padding: 3px 0; }
    .ordered-toggle { display: flex; align-items: center; gap: 8px; padding: 6px 4px; cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .ordered-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .ordered-chip { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 14px; border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--muted); }
    .ordered-chip button { width: 26px; height: 26px; border-radius: 50%; background: color-mix(in srgb, var(--text) 12%, transparent); color: var(--text); padding: 0; display: flex; align-items: center; justify-content: center; }

    .field-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type=text], input[type=url], input[type=number] {
      width: 100%; height: 52px; padding: 0 18px; border-radius: 999px; border: none;
      background: var(--surface); color: var(--text); font-size: 16.5px; font-family: var(--font-body);
      margin-bottom: 16px;
    }
    textarea {
      width: 100%; padding: 12px 16px; border-radius: 16px; border: none;
      background: var(--surface); color: var(--text); font-size: 15.5px; font-family: var(--font-body);
      resize: vertical; min-height: 48px;
    }
    input::placeholder, textarea::placeholder { color: var(--muted-2); }
    .stepper-box { flex: 1; background: var(--surface); border-radius: 20px; padding: 12px 16px; }
    .stepper-box .s-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .stepper-row { display: flex; align-items: center; justify-content: space-between; }
    .stepper-row .val { font-family: var(--font-heading); font-weight: 400; font-size: 17px; }
    .step-btn { width: 32px; height: 32px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; }
    .step-btn.minus { background: var(--surface-2); color: var(--text); }
    .step-btn.plus { background: var(--accent); color: var(--on-accent); }
    .ing-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .ing-row input.qty { width: 50px; height: 44px; padding: 0 8px; text-align: center; margin-bottom: 0; }
    .ing-row input.unit { width: 56px; height: 44px; padding: 0 8px; text-align: center; margin-bottom: 0; }
    .ing-row input.name { flex: 1; min-width: 0; height: 44px; margin-bottom: 0; }
    .ing-row .row-remove { width: 36px; height: 36px; flex-shrink: 0; background: transparent; color: var(--muted-2); padding: 0; display: flex; align-items: center; justify-content: center; }
    .step-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
    .step-row .step-num { width: 28px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-size: 14px; color: var(--muted-2); }
    .step-row textarea { flex: 1; min-width: 0; margin-bottom: 0; }
    .step-row .row-remove { width: 36px; height: 36px; flex-shrink: 0; background: transparent; color: var(--muted-2); padding: 0; display: flex; align-items: center; justify-content: center; }
    .add-row-btn {
      display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px;
      border: 1.5px dashed var(--div-mid); background: transparent; color: var(--muted);
      font-family: var(--font-body); font-size: 13px; margin-bottom: 20px;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: flex; align-items: flex-end; justify-content: center; z-index: 50;
    }
    .modal-card {
      background: var(--surface); border-radius: 28px 28px 0 0;
      padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 24px) 20px;
      width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-title { font-family: var(--font-heading); font-weight: 400; font-size: 19px; color: var(--text); }
    .modal-close { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); color: var(--muted); padding: 0; display: flex; align-items: center; justify-content: center; }

    .mode-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .mode-list button { height: 48px; padding: 0 18px; text-align: left; background: var(--surface-2); color: var(--muted); font-size: 14px; }
    .mode-list button.active { background: var(--accent); color: var(--on-accent); }
    .mode-list button.active.leftover-mode { background: var(--sage); color: var(--on-accent); }

    .fresh-toggle { display: inline-flex; border-radius: 999px; background: var(--surface-2); padding: 4px; margin-bottom: 12px; }
    .fresh-toggle button { height: 38px; padding: 0 14px; font-size: 13px; background: transparent; color: var(--muted); }
    .fresh-toggle button.active { background: var(--accent); color: var(--on-accent); }
    .fresh-toggle button.active.leftover-active { background: var(--sage); color: var(--on-accent); }

    .picker-search { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); margin-bottom: 10px; }
    .picker-search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; color: var(--text); font-size: 14px; font-family: var(--font-body); }
    .picker-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-height: 160px; overflow-y: auto; }
    .picker-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-radius: 16px; background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 14px; }
    .picker-row.selected { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); color: var(--accent-light); }

    .portions-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); border-radius: 18px; padding: 12px 16px; margin-bottom: 16px; }
    .portions-row .p-label { font-size: 13px; color: var(--muted); }
    .portions-row .p-controls { display: flex; align-items: center; gap: 12px; }
    .portions-row .p-val { font-family: var(--font-heading); font-weight: 400; font-size: 16px; min-width: 16px; text-align: center; }

    #screen-detail {
      position: fixed; inset: 0; background: var(--bg); z-index: 20;
      display: none; flex-direction: column;
    }
    #screen-detail.active { display: flex; }
    .detail-head { padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 6px 16px; flex-shrink: 0; }
    .detail-scroll { flex: 1; overflow-y: auto; padding: 8px 20px 44px 20px; }
    .detail-title { font-family: var(--font-heading); font-weight: 400; font-size: 31px; color: var(--text); line-height: 1.15; margin: 0 0 8px 0; }
    .detail-meta-row { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); margin-bottom: 20px; flex-wrap: wrap; }
    .detail-meta-row .src { display: flex; align-items: center; gap: 5px; }
    .archived-tag { padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 12px; }
    .servings-panel { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 22px; padding: 16px 20px; margin-bottom: 18px; }
    .servings-panel .lbl { font-size: 15.5px; color: var(--text); }
    .servings-panel .controls { display: flex; align-items: center; gap: 14px; }
    .servings-panel .val { font-family: var(--font-heading); font-weight: 400; font-size: 22px; min-width: 22px; text-align: center; }
    .servings-panel .stepc { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; padding: 0; display: flex; align-items: center; justify-content: center; }
    .servings-panel .stepc.minus { background: var(--surface-2); color: var(--text); }
    .servings-panel .stepc.plus { background: var(--accent); color: var(--on-accent); }
    .edit-basis-link { color: var(--muted-2); font-size: 13px; background: none; text-decoration: underline; padding: 4px 0 16px 0; display: block; }
    .detail-h2 { font-family: var(--font-heading); font-weight: 400; font-size: 21px; color: var(--text); margin: 0 0 10px 0; }
    .ingredients-box { background: var(--surface); border-radius: 22px; padding: 6px 18px; margin-bottom: 22px; }
    .ingredients-box .ing-line { padding: 12px 0; font-size: 15.5px; color: var(--text); border-bottom: 1px solid var(--div-soft); }
    .ingredients-box .ing-line:last-child { border-bottom: none; }
    .steps-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .step-card { display: flex; gap: 12px; background: var(--surface); border-radius: 18px; padding: 15px 17px; }
    .step-card .num {
      width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
      font-family: var(--font-heading); font-weight: 400; font-size: 14px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .step-card .txt { font-size: 15.5px; color: var(--text); line-height: 1.5; padding-top: 2px; }
    .rating-card { background: var(--surface); border-radius: 22px; padding: 17px 19px; margin-bottom: 14px; }
    .rating-card .q { font-size: 15px; color: var(--muted); margin-bottom: 10px; }
    .rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .rating-row .star { border: none; background: transparent; padding: 2px; cursor: pointer; }
    .rating-row .star svg { width: 33px; height: 33px; display: block; }
    .rating-label { font-size: 14px; color: var(--muted-2); min-height: 18px; }
    .kids-fav-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 22px; padding: 16px 19px; margin-bottom: 26px; cursor: pointer; }
    .kids-fav-row .lbl { font-size: 15.5px; color: var(--text); }
    .kids-fav-row svg { width: 24px; height: 24px; flex-shrink: 0; }
    .detail-actions-wrap { margin-top: 4px; }

    a.recipe-link { color: var(--accent-light); font-size: 12px; text-decoration: none; }

    @media (min-width: 800px) and (hover: hover) and (pointer: fine) {
      #app { max-width: 1080px; padding: 110px 32px 48px 32px; }

      #nav {
        position: fixed; top: 0; bottom: auto; left: 0; right: 0;
        justify-content: center; gap: 6px; align-items: stretch;
        border-top: none; border-bottom: 1px solid var(--div-soft);
        padding: 14px 16px;
      }
      #nav button { flex: none; flex-direction: row; gap: 8px; padding: 11px 22px; min-height: auto; }
      #nav button .icon svg { width: 20px; height: 20px; }
      #nav button span.label { font-size: 13px; }

      #kandidatenList, #geschiedenisList, #planningUnscheduled, #boodschappenList {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px; align-items: start;
      }
      #kandidatenList .empty, #geschiedenisList .empty, #boodschappenList .empty,
      #boodschappenList .section-label { grid-column: 1 / -1; }
      #boodschappenList .card:first-child { grid-column: 1 / -1; }

      #screen-toevoegen { max-width: 640px; margin: 0 auto; }
      .detail-scroll { max-width: 640px; margin: 0 auto; width: 100%; }

      .modal-overlay { align-items: center; }
      .modal-card { border-radius: 24px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ===== Kandidaten ===== -->
  <div id="screen-kandidaten" class="screen">
    <h1>Kandidaten<span class="sub" id="candidateCountLabel"></span></h1>
    <div class="btn-row" style="margin-bottom:14px">
      <button class="primary" id="gmailImportBtn" onclick="runGmailImport()">📥 Importeer nu</button>
      <button class="outline" onclick="showScreen('toevoegen')">+ Handmatig</button>
    </div>
    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted-2)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
      <input type="text" id="candidateSearch" placeholder="Zoek in kandidaten..." oninput="renderKandidaten()">
    </div>
    <div id="kandidatenList"></div>
  </div>

  <!-- ===== Planning ===== -->
  <div id="screen-planning" class="screen">
    <h1 class="tight">Planning</h1>
    <div class="week-nav-row">
      <button class="icon-btn" onclick="shiftPlanningWeek(-1)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <div class="week-label" id="planningWeekRangeLabel"></div>
      <button class="icon-btn" onclick="shiftPlanningWeek(1)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
    </div>
    <button class="today-jump" id="planningTodayBtn" onclick="resetPlanningWeek()" style="display:none">Vandaag</button>
    <div id="planningUnscheduled"></div>
    <div id="planningGrid"></div>
  </div>

  <!-- ===== Boodschappen ===== -->
  <div id="screen-boodschappen" class="screen">
    <h1>Boodschappen<span class="sub">Voor de komende 2 weken</span></h1>
    <div id="boodschappenList"></div>
    <div id="boodschappenBesteld"></div>
  </div>

  <!-- ===== Geschiedenis ===== -->
  <div id="screen-geschiedenis" class="screen">
    <h1 class="tight">Geschiedenis</h1>
    <div class="segmented">
      <button id="sortDatumBtn" class="active" onclick="setGeschiedenisSort('datum')">Datum</button>
      <button id="sortRatingBtn" onclick="setGeschiedenisSort('rating')">Beoordeling</button>

<script>
  /* ===== API-configuratie ====
     Bewust NIET hardcoded: deze site draait op een publieke GitHub Pages repo,
     dus de URL/token worden éénmalig opgevraagd en lokaal in dit apparaat
     bewaard (localStorage) i.p.v. in de broncode. Zie SETUP.md.
     Open de pagina met ?reset=config om ze opnieuw in te vullen. */
  if (new URLSearchParams(location.search).get('reset') === 'config') {
    localStorage.removeItem('mr_apiUrl');
    localStorage.removeItem('mr_apiToken');
  }
  let API_URL = localStorage.getItem('mr_apiUrl') || '';
  let API_TOKEN = localStorage.getItem('mr_apiToken') || '';

  function ensureConfig() {
    if (!API_URL) {
      API_URL = (prompt('Plak hier je Apps Script webapp-URL (eindigt op /exec):') || '').trim();
      if (API_URL) localStorage.setItem('mr_apiUrl', API_URL);
    }
    if (!API_TOKEN) {
      API_TOKEN = (prompt('Plak hier je geheime token (zelfde als API_TOKEN in Code.gs):') || '').trim();
      if (API_TOKEN) localStorage.setItem('mr_apiToken', API_TOKEN);
    }
  }

  function callApi(fn, payload) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, token: API_TOKEN, payload: payload || {} })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.error) throw new Error(data.error);
        return data.result;
      });
  }

  const RATING_LABELS = ['Nog niet beoordeeld', 'Vies', 'Oké', 'Lekker', 'Topper!'];
  const WEEKDAGEN = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
  const STAR_SVG = '<svg viewBox="0 0 24 24" stroke-width="1.75"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>';
  const CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>';
  const UNDO_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"></path><path d="M3 3v5h5"></path></svg>';
  const TRASH_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>';

  let recipes = [];
  let planning = [];
  let currentDetailId = null;
  let geschiedenisSort = 'datum';
  let candidateConfirmDeleteId = null;
  let detailConfirmingDelete = false;

  function loadAll() {
    Promise.all([callApi('getRecipes'), callApi('getPlanning')])
      .then(function(results) {
        recipes = results[0];
        planning = results[1];
        renderAll();
      })
      .catch(onServerError);
  }

  function renderAll() {
    renderKandidaten();
    renderPlanning();
    renderBoodschappen();
    renderGeschiedenis();
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function extractDomain(link) {
    if (!link) return '';
    return link.trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0];
  }

  /* ---- Kandidaten ---- */

  function renderKandidaten() {
    const q = (document.getElementById('candidateSearch').value || '').trim().toLowerCase();
    const all = recipes.filter(r => r.status === 'Kandidaat');
    const list = all.filter(r => !q || r.titel.toLowerCase().includes(q));
    document.getElementById('candidateCountLabel').textContent =
      all.length === 0 ? 'Geen nieuwe recepten' : all.length + ' ' + (all.length === 1 ? 'nieuw recept' : 'nieuwe recepten') + ' om te proberen';

    const el = document.getElementById('kandidatenList');
    if (!list.length) {
      el.innerHTML = '<div class="empty"><div class="emoji">🍽️</div><div class="msg">' +
        (q ? 'Geen kandidaten gevonden.' : 'Geen kandidaten meer.<br>Importeer of voeg er handmatig een toe.') + '</div></div>';
      return;
    }
    el.innerHTML = list.map(function(r) {
      const domain = extractDomain(r.link);
      const confirming = candidateConfirmDeleteId === r.id;
      let actions;
      if (confirming) {
        actions = '<div class="card-actions" style="align-items:center;padding-top:10px;border-top:1px solid var(--div-soft)">' +
          '<span style="flex:1;font-size:13px;color:var(--muted)">Weet je het zeker?</span>' +
          '<button class="outline subtle" onclick="candidateConfirmDeleteId=null;renderKandidaten()">Annuleren</button>' +
          '<button class="confirm-danger" onclick="removeRecipe(\'' + r.id + '\')">Ja, verwijderen</button>' +
          '</div>';
      } else {
        actions = '<div class="card-actions">' +
          '<button class="primary" style="flex:1" onclick="chooseForWeek(\'' + r.id + '\')">Kies voor deze week</button>' +
          '<button class="outline subtle" onclick="candidateConfirmDeleteId=\'' + r.id + '\';renderKandidaten()">' + TRASH_SVG + ' Verwijderen</button>' +
          '</div>';
      }
      return '<div class="card">' +
        '<div onclick="openDetail(\'' + r.id + '\')" style="cursor:pointer">' +
        '<div class="card-title">' + escapeHtml(r.titel) + '</div>' +
        '<div class="card-meta"><span>' + r.aantalPersonenBasis + ' pers.</span>' +
        (r.bereidingstijd ? '<span>⏱ ' + escapeHtml(r.bereidingstijd) + '</span>' : '') + '</div>' +
        (domain ? '<div class="card-source">🔗 ' + escapeHtml(domain) + '</div>' : '') +
        '</div>' + actions + '</div>';
    }).join('');
  }

  function chooseForWeek(id) {
    const r = recipes.find(x => x.id === id);
    r.status = 'Actief';
    renderAll();
    callApi('updateRecipe', { id: id, status: 'Actief' }).catch(onServerError);
    showScreen('planning');
  }

  function removeRecipe(id) {
    candidateConfirmDeleteId = null;
    recipes = recipes.filter(x => x.id !== id);
    renderAll();
    callApi('deleteRecipe', { id: id }).catch(onServerError);
  }

  function onServerError(err) {
    alert('Er ging iets mis: ' + (err && err.message ? err.message : err));
  }

  function runGmailImport() {
    const btn = document.getElementById('gmailImportBtn');
    btn.disabled = true;
    btn.textContent = 'Bezig...';
    callApi('importFromGmail').then(function(message) {
      btn.disabled = false;
      btn.textContent = '📥 Importeer nu';
      alert(message);
      loadAll();
    }).catch(function(err) {
      btn.disabled = false;
      btn.textContent = '📥 Importeer nu';
      onServerError(err);
    });
  }

  /* ---- datumhulpjes ---- */

  function getPlanningWindowDates(offsetWeeks) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const day = today.getDay();
    const diffToMonday = (day === 0 ? -6 : 1) - day;
    const monday = new Date(today); monday.setDate(today.getDate() + diffToMonday + (offsetWeeks || 0) * 7);
    const dates = [];
    for (let i = 0; i < 14; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      dates.push(d);
    }
    return dates;
  }

  function toDateKey(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function weekdagNaam(d) {
    return WEEKDAGEN[d.getDay() === 0 ? 6 : d.getDay() - 1];
  }

  const DUTCH_MON = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

  /* ---- planning ---- */

  let planningWeekOffset = 0;

  function shiftPlanningWeek(delta) {
    planningWeekOffset += delta;
    renderPlanning();
  }

  function resetPlanningWeek() {
    planningWeekOffset = 0;
    renderPlanning();
  }

  function renderPlanning() {
    const dates = getPlanningWindowDates(planningWeekOffset);
    const scheduledIds = new Set(planning.filter(p => p.type === 'Recept' && p.recipeId).map(p => p.recipeId));
    const unscheduled = recipes.filter(r => r.status === 'Actief' && !scheduledIds.has(r.id));

    const unschEl = document.getElementById('planningUnscheduled');
    unschEl.innerHTML = !unscheduled.length ? '' : '<div class="section-label">Nog niet ingepland</div>' +
      unscheduled.map(r => '<div class="card"><div class="card-title">' + escapeHtml(r.titel) + '</div>' +
        '<div class="card-actions"><button class="outline" onclick="openDetail(\'' + r.id + '\')">Bekijken</button></div></div>').join('');

    const monday = dates[0];
    const sundayW2 = dates[13];
    document.getElementById('planningWeekRangeLabel').textContent =
      monday.getDate() + ' ' + DUTCH_MON[monday.getMonth()] + ' – ' + sundayW2.getDate() + ' ' + DUTCH_MON[sundayW2.getMonth()];
    document.getElementById('planningTodayBtn').style.display = planningWeekOffset === 0 ? 'none' : 'block';

    const todayKey = toDateKey(new Date());
    let html = '';
    dates.forEach((d, i) => {
      if (i === 0) html += '<div class="section-label">Deze week</div>';
      if (i === 7) html += '<div class="section-label">Volgende week</div>';
      const key = toDateKey(d);
      const entry = planning.find(p => p.datum === key);
      const isToday = key === todayKey;
      let bodyHtml, filled = false;
      if (!entry) {
        bodyHtml = '<div class="day-empty-label">Nog geen plan</div>';
      } else {
        filled = true;
        if (entry.type === 'Restjes') {
          bodyHtml = '<div class="day-title">🥡 ' + (entry.notitie ? escapeHtml(entry.notitie) : 'Restjes') + '</div>';
        } else if (entry.type === 'Anders') {
          bodyHtml = '<div class="day-title">📝 ' + (entry.notitie ? escapeHtml(entry.notitie) : 'Anders') + '</div>';
        } else {
          const r = recipes.find(x => x.id === entry.recipeId);
          const titel = r ? escapeHtml(r.titel) : '(verwijderd recept)';
          const icon = entry.isKookdag === false ? '🥡' : '🍳';
          bodyHtml = '<div class="day-title">' + icon + ' ' + titel + '</div>' +
            '<div class="day-sub">' + entry.portions + ' ' + (entry.portions === 1 ? 'portie' : 'porties') + (entry.ingredientenBesteld ? ' · 🛒' : '') + '</div>';
        }
      }
      html += '<div class="day-row' + (filled ? ' filled' : '') + '" onclick="openDayEditor(\'' + key + '\')" style="' +
        (isToday ? 'border-color:var(--accent-light);border-style:solid;' : '') + '">' +
        '<div class="day-num-wrap"><div class="weekday">' + weekdagNaam(d) + '</div><div class="daynum">' + d.getDate() + '</div></div>' +
        '<div class="day-body">' + bodyHtml + '</div>' +
        (isToday ? '<div class="today-tag">Vandaag</div>' : '') +
        '</div>';
    });
    document.getElementById('planningGrid').innerHTML = html;
  }

  let dayEditorDate = null;
  let dayEditorType = 'Recept';
  let dayEditorIsKookdag = true;
  let dayEditorSelectedRecipeId = null;

  function openDayEditor(dateKey) {
    dayEditorDate = dateKey;
    const entry = planning.find(p => p.datum === dateKey);
    const d = new Date(dateKey + 'T00:00:00');
    const DUTCH_WD_FULL = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
    document.getElementById('dayEditorTitle').textContent = DUTCH_WD_FULL[d.getDay()] + ' ' + d.getDate() + ' ' + DUTCH_MON[d.getMonth()];

    dayEditorSelectedRecipeId = entry && entry.type === 'Recept' ? entry.recipeId : null;
    document.getElementById('dayEditorRecipeSearch').value = '';
    setDayEditorType(entry ? entry.type : 'Recept');
    setDayEditorKookdag(entry && entry.type === 'Recept' ? entry.isKookdag !== false : true);
    document.getElementById('dayEditorPortionsVal').textContent = (entry && entry.portions) || 4;
    document.getElementById('dayEditorNotitie').value = (entry && entry.notitie) || '';
    document.getElementById('dayEditorDeleteBtn').style.display = entry ? 'block' : 'none';
    renderDayEditorRecipePicker();
    document.getElementById('dayEditorOverlay').style.display = 'flex';
  }

  function renderDayEditorRecipePicker() {
    const q = (document.getElementById('dayEditorRecipeSearch').value || '').trim().toLowerCase();
    const windowKeys = new Set(getPlanningWindowDates(planningWeekOffset).map(toDateKey));

      return '<div class="picker-row' + (selected ? ' selected' : '') + '" onclick="dayEditorSelectedRecipeId=\'' + r.id + '\';renderDayEditorRecipePicker()">' +
        '<span>' + escapeHtml(r.titel) + (r.status === 'Archief' ? ' (gearchiveerd)' : '') + '</span>' +
        (selected ? CHECK_SVG : '') + '</div>';
    }).join('');

    const versBtn = document.getElementById('kookdagVersBtn');
    const restjeBtn = document.getElementById('kookdagRestjeBtn');
    versBtn.classList.toggle('active', isKookdag);
    restjeBtn.classList.toggle('active', !isKookdag);
    restjeBtn.classList.toggle('leftover-active', !isKookdag);
    document.getElementById('dayEditorPortionsLabel').textContent = isKookdag ? 'Porties gekookt' : 'Porties gegeten';

    dayEditorDate = null;
  }

  function viewRecipeFromDayEditor() {
    if (!dayEditorSelectedRecipeId) return;
    const id = dayEditorSelectedRecipeId;
    closeDayEditor();
    openDetail(id);

  function saveDayEditor() {
    const entry = planning.find(p => p.datum === dayEditorDate);
    const payload = { datum: dayEditorDate, type: dayEditorType };
    if (dayEditorType === 'Recept') {
      if (!dayEditorSelectedRecipeId) { alert('Kies een recept, of kies Restjes/Anders.'); return; }
      payload.recipeId = dayEditorSelectedRecipeId;
      payload.portions = parseFloat(document.getElementById('dayEditorPortionsVal').textContent) || 1;
      payload.notitie = '';
      payload.isKookdag = dayEditorIsKookdag;
    } else {
      payload.recipeId = '';
      payload.portions = 0;
      payload.notitie = document.getElementById('dayEditorNotitie').value.trim();
      payload.isKookdag = true;
    }
    if (entry) payload.id = entry.id;

    callApi('savePlanningEntry', payload).then(function(id) {
      if (entry) {
        Object.assign(entry, payload);
      } else {
        planning.push(Object.assign({ ingredientenBesteld: false }, payload, { id: id }));
      }
      closeDayEditor();
      renderAll();
    }).catch(onServerError);

  function deleteDayEditor() {
    const entry = planning.find(p => p.datum === dayEditorDate);
    if (!entry) { closeDayEditor(); return; }
    planning = planning.filter(p => p.id !== entry.id);
    callApi('deletePlanningEntry', { id: entry.id }).catch(onServerError);
    closeDayEditor();
    renderAll();
  }

  /* ---- boodschappen ---- */

  function parseIngredientAmount(line) {
    const m = line.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+[.,]\d+|\d+)(\s*)/);
    if (!m) return null;
    return { raw: m[1], rest: line.slice(m[0].length) };
  }

  function amountToNumber(raw) {
    raw = raw.trim();
    if (raw.indexOf(' ') !== -1) {
      const parts = raw.split(' ');
      const frac = parts[1].split('/');
      return Number(parts[0]) + Number(frac[0]) / Number(frac[1]);
    }
    if (raw.indexOf('/') !== -1) {
      const frac = raw.split('/');
      return Number(frac[0]) / Number(frac[1]);
    }
    return parseFloat(raw.replace(',', '.'));
  }

  function formatAmount(num) {
    const rounded = Math.round(num * 100) / 100;
    if (Number.isInteger(rounded)) return String(rounded);
    return String(rounded.toFixed(2)).replace(/0+$/, '').replace(/\.$/, '');
  }

  function scaleIngredientLine(line, factor) {
    const parsed = parseIngredientAmount(line);
    if (!parsed) return line;
    const scaled = amountToNumber(parsed.raw) * factor;
    return formatAmount(scaled) + ' ' + parsed.rest;
  }

  function renderBoodschappen() {
    const keys = new Set(getPlanningWindowDates().map(toDateKey));
    const active = planning.filter(p => p.type === 'Recept' && p.recipeId && p.isKookdag !== false && !p.ingredientenBesteld && keys.has(p.datum));
    const ordered = planning.filter(p => p.type === 'Recept' && p.recipeId && p.isKookdag !== false && p.ingredientenBesteld && keys.has(p.datum));

    function groupByRecipe(entries) {
      const map = {};
      entries.forEach(e => {
        if (!map[e.recipeId]) map[e.recipeId] = { recipeId: e.recipeId, portions: 0, ids: [] };
        map[e.recipeId].portions += Number(e.portions) || 0;
        map[e.recipeId].ids.push(e.id);
      });
      return Object.values(map);
    }

    const activeGroups = groupByRecipe(active);
    const listEl = document.getElementById('boodschappenList');
    if (!activeGroups.length) {
      listEl.innerHTML = '<div class="empty"><div class="emoji">🛒</div><div class="msg">Nog niets om te kopen.<br>Plan een paar verse maaltijden in Planning.</div></div>';
    } else {
      const merged = {};
      const perRecipeHtml = activeGroups.map(g => {
        const r = recipes.find(x => x.id === g.recipeId);
        if (!r) return '';
        const factor = g.portions / r.aantalPersonenBasis;
        const scaledLines = (r.ingredienten || '').split('\n').map(s => s.trim()).filter(Boolean)
          .map(l => scaleIngredientLine(l, factor));
        scaledLines.forEach(line => {
          const parsed = parseIngredientAmount(line);
          const key = (parsed ? parsed.rest : line).trim().toLowerCase();
          if (!merged[key]) merged[key] = { text: (parsed ? parsed.rest : line).trim(), amount: 0, hasAmount: !!parsed };
          if (parsed) merged[key].amount += amountToNumber(parsed.raw);
        });
        return '<div class="card">' +
          '<div class="grocery-group-head"><div><div class="g-title">' + escapeHtml(r.titel) + '</div>' +
          '<div class="g-meta">' + g.portions + ' ' + (g.portions === 1 ? 'portie' : 'porties') + '</div></div>' +
          '<button class="outline subtle" onclick="markOrdered(\'' + g.recipeId + '\')">Besteld</button></div>' +
          scaledLines.map(l => '<div class="grocery-item-line">· ' + escapeHtml(l) + '</div>').join('') +
          '</div>';
      }).join('');

      const mergedHtml = Object.values(merged).map(m =>
        '<div class="dot-item"><span class="dot"></span>' + escapeHtml((m.hasAmount ? formatAmount(m.amount) + ' ' : '') + m.text) + '</div>'
      ).join('');

      listEl.innerHTML = '<div class="card"><div class="card-title">Totale lijst</div>' + mergedHtml + '</div>' +
        '<div class="section-label" style="margin-top:18px">Per recept</div>' + perRecipeHtml;
    }

    const orderedGroups = groupByRecipe(ordered);
    const orderedEl = document.getElementById('boodschappenBesteld');
    if (!orderedGroups.length) {
      orderedEl.innerHTML = '';
    } else {
      orderedEl.innerHTML = '<div class="ordered-toggle" onclick="toggleOrderedList()">' + CHECK_SVG +
        '<span>' + orderedGroups.length + ' ' + (orderedGroups.length === 1 ? 'recept besteld' : 'recepten besteld') + '</span></div>' +
        '<div class="ordered-chips" id="orderedChips" style="display:' + (window.__showOrdered ? 'flex' : 'none') + '">' +
        orderedGroups.map(g => {
          const r = recipes.find(x => x.id === g.recipeId);
          return '<div class="ordered-chip">' + escapeHtml(r ? r.titel : '(verwijderd recept)') +
            '<button onclick="undoOrdered(\'' + g.recipeId + '\')">' + UNDO_SVG + '</button></div>';
        }).join('') + '</div>';
    }
  }

  function toggleOrderedList() {
    window.__showOrdered = !window.__showOrdered;
    renderBoodschappen();
  }

  function markOrdered(recipeId) {
    const ids = planning.filter(p => p.type === 'Recept' && p.recipeId === recipeId && p.isKookdag !== false && !p.ingredientenBesteld).map(p => p.id);
    ids.forEach(id => { const e = planning.find(p => p.id === id); if (e) e.ingredientenBesteld = true; });
    renderAll();
    callApi('setPlanningBesteld', { ids: ids, value: true }).catch(onServerError);
  }

  function undoOrdered(recipeId) {
    const ids = planning.filter(p => p.type === 'Recept' && p.recipeId === recipeId && p.isKookdag !== false && p.ingredientenBesteld).map(p => p.id);
    ids.forEach(id => { const e = planning.find(p => p.id === id); if (e) e.ingredientenBesteld = false; });
    renderAll();
    callApi('setPlanningBesteld', { ids: ids, value: false }).catch(onServerError);
  }

  /* ---- geschiedenis / ratings ---- */

  function setGeschiedenisSort(mode) {
    geschiedenisSort = mode;
    renderGeschiedenis();
  }

  function renderGeschiedenis() {
    document.getElementById('sortDatumBtn').classList.toggle('active', geschiedenisSort === 'datum');
    document.getElementById('sortRatingBtn').classList.toggle('active', geschiedenisSort === 'rating');

    let list;
    if (geschiedenisSort === 'rating') {
      list = recipes.filter(r => r.rating > 0).sort((a, b) => {
        if (b.rating !== a.rating) return b.rating - a.rating;
        return new Date(b.datumGekookt || b.datumToegevoegd || 0) - new Date(a.datumGekookt || a.datumToegevoegd || 0);
      });
    } else {
      list = recipes.filter(r => r.datumGekookt).sort((a, b) => new Date(b.datumGekookt) - new Date(a.datumGekookt));
    }

    const el = document.getElementById('geschiedenisList');
    if (!list.length) {
      el.innerHTML = '<div class="empty"><div class="emoji">📖</div><div class="msg">' +
        (geschiedenisSort === 'rating' ? 'Nog geen beoordeelde recepten.' : 'Nog niets gekookt.') + '</div></div>';
      return;
    }
    el.innerHTML = list.map(r => {
      const stars = [1, 2, 3, 4].map(n => '<span style="display:inline-flex;width:13px;height:13px;color:' +
        (n <= r.rating ? 'var(--accent-light)' : 'var(--surface-2)') + '">' + STAR_SVG.replace('viewBox', 'width="13" height="13" fill="currentColor" stroke="currentColor" viewBox') + '</span>').join('');
      return '<div class="card" onclick="openDetail(\'' + r.id + '\')" style="cursor:pointer">' +
        '<div class="card-title" style="margin-bottom:0">' + escapeHtml(r.titel) + '</div>' +
        '<div class="card-meta" style="margin:0">' + (r.datumGekookt ? new Date(r.datumGekookt).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) : '') + '</div>' +
        '<div style="display:flex;align-items:center;gap:3px;margin-top:2px">' + stars +
        (r.favorietKinderen ? '<span class="heart-tag" style="color:var(--heart);margin-left:5px">❤</span>' : '') + '</div>' +
        '</div>';
    }).join('');
  }

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.querySelectorAll('#nav button').forEach(b => {
      b.classList.toggle('active', b.dataset.screen === name);
    });
    window.scrollTo(0, 0);
  }

  /* ---- detail / scaling ---- */

  function openDetail(id, prefillPersonen) {
    currentDetailId = id;
    detailConfirmingDelete = false;
    const r = recipes.find(x => x.id === id);
    document.getElementById('detailTitel').textContent = r.titel;

    const tijdWrap = document.getElementById('detailTijdWrap');
    if (r.bereidingstijd) {
      document.getElementById('detailTijdText').textContent = r.bereidingstijd;
      tijdWrap.style.display = 'inline';
    } else {
      tijdWrap.style.display = 'none';
    }

    const linkEl = document.getElementById('detailLink');
    if (r.link) {
      linkEl.href = r.link;
      document.getElementById('detailLinkText').textContent = extractDomain(r.link);
      linkEl.style.display = 'inline-flex';
    } else {
      linkEl.style.display = 'none';
    }

    document.getElementById('detailArchivedTag').style.display = r.status === 'Archief' ? 'inline-flex' : 'none';

    document.getElementById('editBasisBtn').textContent = 'basis: ' + r.aantalPersonenBasis + ' personen (aanpassen)';
    document.getElementById('aantalPersonenVal').textContent = prefillPersonen || r.aantalPersonenBasis;
    renderIngredienten();
    renderBereiding();
    renderRating();
    updateKidsFavIcon(r.favorietKinderen);
    renderDetailActions(r);
    showScreen('detail');
  }

  function backFromDetail() {
    const r = recipes.find(x => x.id === currentDetailId);
    showScreen(r && r.status === 'Archief' ? 'geschiedenis' : (r && r.status === 'Actief' ? 'planning' : 'kandidaten'));
  }

  function editBasis() {
    const r = recipes.find(x => x.id === currentDetailId);
    const val = prompt('Basis aantal personen voor dit recept:', r.aantalPersonenBasis);
    if (!val) return;
    const n = parseFloat(val.replace(',', '.'));
    if (!n || n <= 0) return;
    r.aantalPersonenBasis = n;
    document.getElementById('editBasisBtn').textContent = 'basis: ' + n + ' personen (aanpassen)';
    document.getElementById('aantalPersonenVal').textContent = n;
    renderIngredienten();
    callApi('updateRecipe', { id: r.id, aantalPersonenBasis: n }).catch(onServerError);
  }

  function changePersonen(delta) {
    const el = document.getElementById('aantalPersonenVal');
    const n = Math.max(1, (parseFloat(el.textContent) || 1) + delta);
    el.textContent = n;
    renderIngredienten();
  }

  function renderIngredienten() {
    const r = recipes.find(x => x.id === currentDetailId);
    if (!r) return;
    const gekozen = parseFloat(document.getElementById('aantalPersonenVal').textContent) || r.aantalPersonenBasis;
    const factor = gekozen / r.aantalPersonenBasis;
    const lines = (r.ingredienten || '').split('\n').map(s => s.trim()).filter(Boolean);
    const el = document.getElementById('ingredientenList');
    if (!lines.length) {
      el.innerHTML = '<div class="ing-line" style="color:var(--muted-2)">Geen ingrediënten opgeslagen.</div>';
      return;
    }
    el.innerHTML = lines.map(l => '<div class="ing-line">' + escapeHtml(scaleIngredientLine(l, factor)) + '</div>').join('');
  }

  function renderBereiding() {
    const r = recipes.find(x => x.id === currentDetailId);
    const steps = (r.bereiding || '').split('\n').map(s => s.trim()).filter(Boolean);
    const el = document.getElementById('bereidingList');
    el.innerHTML = steps.length ? steps.map((s, i) => '<div class="step-card"><div class="num">' + (i + 1) + '</div><div class="txt">' + escapeHtml(s) + '</div></div>').join('') :
      '<div style="color:var(--muted-2);font-size:14px">Geen bereidingsstappen opgeslagen.</div>';
  }

  function renderRating() {
    const r = recipes.find(x => x.id === currentDetailId);
    updateStarDisplay(r.rating);
  }

  function updateStarDisplay(rating) {
    document.querySelectorAll('#ratingRow .star').forEach(btn => {
      const filled = Number(btn.dataset.value) <= rating;
      btn.innerHTML = STAR_SVG.replace('stroke-width', (filled ? 'fill="var(--accent)" stroke="var(--accent)" ' : 'fill="none" stroke="var(--surface-2)" ') + 'stroke-width');
    });
    document.getElementById('ratingLabel').textContent = RATING_LABELS[rating] || RATING_LABELS[0];
  }

  document.getElementById('ratingRow').addEventListener('click', function(e) {
    const btn = e.target.closest('.star');
    if (!btn) return;
    const r = recipes.find(x => x.id === currentDetailId);
    let value = Number(btn.dataset.value);
    if (r.rating === value) value = 0;
    r.rating = value;
    updateStarDisplay(value);
    callApi('updateRecipe', { id: r.id, rating: value }).catch(onServerError);
  });

  function updateKidsFavIcon(fav) {
    const heart = document.getElementById('kidsFavHeart');
    heart.setAttribute('fill', fav ? 'var(--heart)' : 'none');
    heart.setAttribute('stroke', fav ? 'var(--heart)' : 'var(--muted-2)');
  }

  function toggleKidsFav() {
    const r = recipes.find(x => x.id === currentDetailId);
    r.favorietKinderen = !r.favorietKinderen;
    updateKidsFavIcon(r.favorietKinderen);
    callApi('updateRecipe', { id: r.id, favorietKinderen: r.favorietKinderen }).catch(onServerError);
  }

  function renderDetailActions(r) {
    const el = document.getElementById('detailActions');
    if (detailConfirmingDelete) {
      el.innerHTML = '<div class="card-actions" style="align-items:center">' +
        '<span style="flex:1;font-size:13px;color:var(--muted)">Weet je het zeker?</span>' +
        '<button class="outline subtle" onclick="detailConfirmingDelete=false;renderDetailActions(recipes.find(x=>x.id===currentDetailId))">Annuleren</button>' +
        '<button class="confirm-danger" onclick="deleteFromDetail()">Ja, verwijderen</button></div>';
      return;
    }
    const archiveLabel = r.status === 'Archief' ? 'Terugzetten uit archief' : 'Archiveren';
    el.innerHTML = '<div class="btn-row">' +
      '<button class="outline subtle" onclick="toggleArchived()">' + archiveLabel + '</button>' +
      '<button class="outline subtle" onclick="detailConfirmingDelete=true;renderDetailActions(recipes.find(x=>x.id===currentDetailId))">Verwijderen</button>' +
      '</div>';
  }

  function markGekooktNu() {
    const r = recipes.find(x => x.id === currentDetailId);
    r.datumGekookt = new Date().toISOString();
    callApi('updateRecipe', { id: r.id, markGekookt: true }).catch(onServerError);
    renderAll();
  }

  function toggleArchived() {
    const r = recipes.find(x => x.id === currentDetailId);
    r.status = r.status === 'Archief' ? 'Actief' : 'Archief';
    document.getElementById('detailArchivedTag').style.display = r.status === 'Archief' ? 'inline-flex' : 'none';
    renderDetailActions(r);
    callApi('updateRecipe', { id: r.id, status: r.status }).catch(onServerError);
    renderAll();
  }

  function deleteFromDetail() {
    const id = currentDetailId;
    recipes = recipes.filter(x => x.id !== id);
    callApi('deleteRecipe', { id: id }).catch(onServerError);
    renderAll();
    showScreen('kandidaten');
  }

  /* ---- handmatig toevoegen ---- */

  let formServings = 4;
  let formCookTime = 30;
  let formIngredients = [{ qty: '', unit: '', name: '' }];
  let formSteps = [''];

  function changeFormServings(delta) {
    formServings = Math.max(1, Math.min(20, formServings + delta));
    document.getElementById('formServingsVal').textContent = formServings;
  }
  function changeFormCookTime(delta) {
    formCookTime = Math.max(5, Math.min(300, formCookTime + delta));
    document.getElementById('formCookTimeVal').textContent = formCookTime;
  }

  function renderFormIngredientRows() {
    const el = document.getElementById('formIngredientRows');
    el.innerHTML = formIngredients.map((row, i) =>
      '<div class="ing-row">' +
      '<input class="qty" type="text" placeholder="qty" value="' + escapeHtml(row.qty) + '" oninput="formIngredients[' + i + '].qty=this.value">' +
      '<input class="unit" type="text" placeholder="eenh." value="' + escapeHtml(row.unit) + '" oninput="formIngredients[' + i + '].unit=this.value">' +
      '<input class="name" type="text" placeholder="ingrediënt" value="' + escapeHtml(row.name) + '" oninput="formIngredients[' + i + '].name=this.value">' +
      (formIngredients.length > 1 ? '<button class="row-remove" onclick="removeFormIngredientRow(' + i + ')">' + TRASH_SVG + '</button>' : '') +
      '</div>'
    ).join('');
  }
  function addFormIngredientRow() { formIngredients.push({ qty: '', unit: '', name: '' }); renderFormIngredientRows(); }
  function removeFormIngredientRow(i) { formIngredients.splice(i, 1); renderFormIngredientRows(); }

  function renderFormStepRows() {
    const el = document.getElementById('formStepRows');
    el.innerHTML = formSteps.map((txt, i) =>
      '<div class="step-row">' +
      '<div class="step-num">' + (i + 1) + '</div>' +
      '<textarea placeholder="Beschrijf deze stap..." oninput="formSteps[' + i + ']=this.value">' + escapeHtml(txt) + '</textarea>' +
      (formSteps.length > 1 ? '<button class="row-remove" onclick="removeFormStepRow(' + i + ')">' + TRASH_SVG + '</button>' : '') +
      '</div>'
    ).join('');
  }
  function addFormStepRow() { formSteps.push(''); renderFormStepRows(); }
  function removeFormStepRow(i) { formSteps.splice(i, 1); renderFormStepRows(); }

  function resetForm() {
    formServings = 4; formCookTime = 30;
    formIngredients = [{ qty: '', unit: '', name: '' }];
    formSteps = [''];
    document.getElementById('newTitel').value = '';
    document.getElementById('newLink').value = '';
    document.getElementById('formServingsVal').textContent = formServings;
    document.getElementById('formCookTimeVal').textContent = formCookTime;
    renderFormIngredientRows();
    renderFormStepRows();
  }

  function submitNewRecipe() {
    const titel = document.getElementById('newTitel').value.trim();
    if (!titel) { alert('Vul een titel in.'); return; }
    const ingredienten = formIngredients
      .filter(row => row.name.trim())
      .map(row => [row.qty.trim(), row.unit.trim(), row.name.trim()].filter(Boolean).join(' '))
      .join('\n');
    const bereiding = formSteps.filter(s => s.trim()).join('\n');
    const recipe = {
      titel: titel,
      link: document.getElementById('newLink').value.trim(),
      aantalPersonenBasis: formServings,
      bereidingstijd: formCookTime + ' minuten',
      ingredienten: ingredienten,
      bereiding: bereiding,
      status: 'Kandidaat'
    };
    callApi('addRecipe', recipe).then(function() {
      resetForm();
      loadAll();
      showScreen('kandidaten');
    }).catch(onServerError);
  }

  renderFormIngredientRows();
  renderFormStepRows();
  ensureConfig();
  loadAll();
  showScreen('kandidaten');
